
name: SonarQube Cloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build and analyze MiCholoMVC
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Install SonarScanner for .NET
        shell: powershell
        run: dotnet tool update dotnet-sonarscanner --global

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          dotnet sonarscanner begin /k:"crowber-brow_MiCholoMVC" /o:"crowber-brow" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.exclusions="MiCholoMVC.Pruebas/**"

      - name: Build main project
        shell: powershell
        run: dotnet build MiCholoMVC/MiCholoMVC.csproj --no-incremental

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
